<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORION NetControl</title>
  </head>
  <body class="min-h-screen relative pb-10 select-none">
    <div class="scanline-layer"></div>

    <!-- Fondo: canvas animado o wallpaper propio (nunca los dos a la vez) -->
    <div id="wallpaper-image" class="fixed inset-0 z-0 bg-cover bg-center hidden pointer-events-none"></div>
    <div id="wallpaper-overlay" class="fixed inset-0 z-0 bg-black/60 hidden pointer-events-none"></div>
    <canvas id="bg-canvas" class="fixed inset-0 w-full h-full z-0 pointer-events-none"></canvas>

    <header class="w-full border-b border-orion-gold/40 bg-orion-bg/95 backdrop-blur-md sticky top-0 z-40 px-4 py-2">
      <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded bg-orion-panelDark border border-orion-gold flex items-center justify-center p-1.5 border-glow-gold">
            <svg viewBox="0 0 100 100" class="w-full h-full" aria-hidden="true">
              <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="none" stroke="#ecc94b" stroke-width="8" />
              <polygon points="50,22 74,36 74,64 50,78 26,64 26,36" fill="#ecc94b" opacity="0.25" />
              <circle cx="50" cy="50" r="12" fill="#00ffa3" />
            </svg>
          </div>
          <div>
            <h1 class="font-orbitron font-extrabold text-lg tracking-wider text-white flex items-center gap-2">
              ORION <span class="text-orion-gold glow-gold">NETCONTROL</span>
              <span id="app-version" class="text-xs text-orion-radiant font-mono"></span>
            </h1>
            <p class="text-[11px] font-mono text-gray-400">DIAGNÓSTICO DE RED PARA DOTA 2 · MIDE, UBICA EL PROBLEMA Y SUGIERE · NO TOCA EL JUEGO</p>
          </div>
        </div>

        <div id="readiness-badge" class="readiness-badge px-3.5 py-1.5 rounded border flex items-center gap-2.5" data-state="no_data">
          <div class="readiness-dot w-3.5 h-3.5 rounded-full"></div>
          <div>
            <div class="text-[9px] font-mono uppercase tracking-widest text-gray-300">¿Buscar partida?</div>
            <div id="readiness-text" class="font-orbitron font-bold text-xs tracking-wide text-white">SIN DATOS</div>
          </div>
        </div>

        <div class="flex items-center gap-2 text-xs font-mono">
          <div class="toolbar-group">
            <label for="region-select" class="text-gray-400">REGIÓN</label>
            <select id="region-select" class="ctl-select"></select>
            <button id="monitor-toggle" class="ctl-btn" title="Iniciar o detener el monitoreo"><i class="fa-solid fa-play"></i></button>
          </div>
          <div class="toolbar-group">
            <select id="sound-preset" class="ctl-select" title="Sonido para los cambios de estado">
              <option value="ping">Ping de mapa</option>
              <option value="bkb">Escudo</option>
              <option value="blink">Destello</option>
              <option value="buyback">Campanilla</option>
              <option value="alert">Sirena</option>
            </select>
            <button id="sound-test" class="ctl-btn" title="Probar sonido"><i class="fa-solid fa-play"></i></button>
            <button id="mute-toggle" class="ctl-btn" title="Silenciar"><i class="fa-solid fa-volume-high"></i></button>
          </div>
          <div class="toolbar-group">
            <button id="match-mode" class="ctl-btn" title="Modo partida: fondo detenido y solo suena el cambio a NO BUSCAR"><i class="fa-solid fa-gamepad"></i> PARTIDA</button>
            <button id="wallpaper-toggle" class="ctl-btn" title="Alternar fondo animado / imagen propia"><i class="fa-solid fa-image"></i></button>
            <label class="ctl-btn cursor-pointer" title="Cargar imagen de fondo">
              <i class="fa-solid fa-upload"></i>
              <input id="wallpaper-input" type="file" accept="image/*" class="hidden" />
            </label>
          </div>
        </div>
      </div>
    </header>

    <div id="demo-banner" class="hidden max-w-7xl mx-auto mt-3 px-4">
      <div class="hud-panel-dire px-4 py-2 font-orbitron text-xs text-orion-dire tracking-wider">
        <i class="fa-solid fa-flask"></i> MODO DEMO — DATOS SIMULADOS, NO SON MEDICIONES REALES
      </div>
    </div>

    <nav class="max-w-7xl mx-auto px-4 pt-3 z-30 relative">
      <div id="tab-bar" class="flex flex-wrap items-center gap-2 border-b border-orion-gold/30 pb-2"></div>
    </nav>

    <main id="tabs" class="max-w-7xl mx-auto px-4 pt-4 space-y-5 z-10 relative"></main>

    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>
    <div id="modal-root"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
